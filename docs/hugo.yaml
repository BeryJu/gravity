baseURL: 'https://gravity.beryju.io/'
locale: en-us
title: Gravity
enableGitInfo: true
enableRobotsTXT: true
github_repo: 'https://github.com/BeryJu/gravity'
github_subdir: docs

params:
  description: Fully-replicated DNS, DHCP and TFTP Server with ad-blocking powered by etcd
  copyright: BeryJu.io
  offlineSearch: true
  ui:
    readingtime:
      enable: true
    showLightDarkModeMenu: true

markup:
  tableOfContents:
    startLevel: 1
    endLevel: 6
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - name: GitHub
      weight: 50
      url: 'https://github.com/BeryJu/gravity'
    - name: Documentation
      weight: 50
      url: /docs
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: 0.160.1
  imports:
    - path: github.com/google/docsy/theme
      disable: false
imaging:
  resampleFilter: CatmullRom
  quality: 75
  anchor: Smart
